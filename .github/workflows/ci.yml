name: CI

# Cheap jobs (engine lint and tests, web UI in a browser) run on every push and pull request.
# Heavy jobs (benchmarks, real model downloads, Windows installers) run only on the weekly
# schedule, when started by hand, or on a pull request with the "run-heavy-ci" label.
# Changes that only touch docs do not run CI at all.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: &docs
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - "CITATION.cff"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/FUNDING.yml"
      - ".github/release.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: *docs
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      heavy:
        description: Heavy jobs to run as well as the cheap ones
        type: choice
        default: all
        options: [all, benchmarks, installers, speech-smoke, none]

# A new push cancels the older run on the same claude/** branch or pull request.
# Main pushes, the weekly schedule and runs started by hand each get a group of their own
# (keyed on the run id), so nothing cancels them or holds them as pending. The event name is
# part of the group, so a push to a branch never cancels a run started by hand on it.
# Adding a label does not cancel, so the cheap jobs already running are kept.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number
    || ((github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id)
    || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  engine:
    name: engine (${{ matrix.os }}, py${{ matrix.python }})
    # Adding a label to a pull request only matters to the heavy jobs.
    if: github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes cost 10x and 2x on a private repo, so only main pushes, the
        # weekly schedule and runs started by hand test all three systems. Pull requests test
        # Ubuntu with both Pythons; pushes to claude/** branches test Ubuntu with one Python.
        os: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/'))) && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python: ${{ fromJSON(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/') && '["3.12"]' || '["3.11", "3.12"]') }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  windows-installer:
    name: Windows install, run, uninstall
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.heavy == 'all' || inputs.heavy == 'installers'))
      || (contains(github.event.pull_request.labels.*.name, 'run-heavy-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'run-heavy-ci'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with the install script
        shell: powershell
        run: ./windows/install.ps1
      - name: Check install (files, Start Menu shortcut, Settings entry)
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ILFU'
          if (-not (Test-Path "$dir\venv\Scripts\ilfu.exe")) { throw 'ilfu.exe missing' }
          if (-not (Test-Path "$dir\uninstall.ps1")) { throw 'uninstall.ps1 missing' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ILFU')) { throw 'Settings entry missing' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'I-L-F-U Call Transcriber.lnk'
          if (-not (Test-Path $lnk)) { throw 'Start Menu shortcut missing' }
          & "$dir\venv\Scripts\ilfu.exe" tier
          & "$dir\venv\Scripts\ilfu.exe" --backend fake record --seconds 1 --out "$env:RUNNER_TEMP\rec"
          if (-not (Test-Path "$env:RUNNER_TEMP\rec\mic.wav")) { throw 'recording missing' }
      - name: Transcribe a generated tone with the installed app (downloads the tiny model)
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ILFU'
          & "$dir\venv\Scripts\python.exe" -c "import math, struct, wave; w = wave.open(r'$env:RUNNER_TEMP\tone.wav', 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b''.join(struct.pack('<h', int(6000*math.sin(2*math.pi*440*i/16000))) for i in range(32000))); w.close()"
          & "$dir\venv\Scripts\ilfu.exe" transcribe "$env:RUNNER_TEMP\tone.wav" --model tiny --out "$env:RUNNER_TEMP\out.txt"
          if ($LASTEXITCODE -ne 0) { throw 'transcription failed' }
          if (-not (Test-Path "$env:RUNNER_TEMP\out.txt")) { throw 'no transcript file' }
          Write-Host 'Transcription pipeline ran on Windows'
      - name: First-run setup without the window (downloads the base model)
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ILFU'
          & "$dir\venv\Scripts\ilfu.exe" setup --model base --accept-terms --save-dir "$env:RUNNER_TEMP\ilfu-data"
          if ($LASTEXITCODE -ne 0) { throw 'setup failed' }
          if (-not (Test-Path "$dir\config.json")) { throw 'config not saved' }
      - name: "App flow with the real model and a fake audio source (record, pause, stop, history)"
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ILFU'
          & "$dir\venv\Scripts\python.exe" .github/scripts/gui_check.py
          if ($LASTEXITCODE -ne 0) { throw 'window flow failed' }
      - name: Real Windows audio devices (informational, runner has no sound card)
        continue-on-error: true
        shell: powershell
        run: '& "$env:LOCALAPPDATA\ILFU\venv\Scripts\ilfu.exe" devices'
      - name: Uninstall
        shell: powershell
        run: ./windows/uninstall.ps1 -Quiet
      - name: Check everything is gone
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ILFU'
          if (Test-Path $dir) { throw 'install folder still exists' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ILFU') { throw 'Settings entry still exists' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'I-L-F-U Call Transcriber.lnk'
          if (Test-Path $lnk) { throw 'shortcut still exists' }
          Write-Host 'Uninstall left nothing behind'

  windows-setup-exe:
    name: Windows one-file installer (build, install, uninstall)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.heavy == 'all' || inputs.heavy == 'installers'))
      || (contains(github.event.pull_request.labels.*.name, 'run-heavy-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'run-heavy-ci'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build ILFU-Setup.exe with Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.1 windows\installer\ilfu.iss
          if (-not (Test-Path dist\ILFU-Setup-0.0.1.exe)) { throw 'installer was not built' }
          Get-Item dist\ILFU-Setup-0.0.1.exe | Select-Object Name, Length
      - name: Run the installer silently
        shell: powershell
        run: |
          Start-Process dist\ILFU-Setup-0.0.1.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'ILFU'
          if (-not (Test-Path "$dir\venv\Scripts\ilfu.exe")) { throw 'installer did not install the app' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ILFU')) { throw 'Settings entry missing' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'I-L-F-U Call Transcriber.lnk'
          if (-not (Test-Path $lnk)) { throw 'Start Menu shortcut missing' }
          & "$dir\venv\Scripts\ilfu.exe" tier
          & "$dir\venv\Scripts\python.exe" -c "import importlib.resources as r; assert r.files('ilfu').joinpath('web/index.html').is_file(); print('web interface files installed')"
      - name: Uninstall and check nothing is left
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\ILFU\uninstall.ps1" -Quiet
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'ILFU')) { throw 'install folder still exists' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ILFU') { throw 'Settings entry still exists' }
      - uses: actions/upload-artifact@v4
        with:
          name: ILFU-Setup-unsigned
          path: dist/ILFU-Setup-0.0.1.exe

  benchmark:
    name: Accuracy and speed (${{ matrix.model }})
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.heavy == 'all' || inputs.heavy == 'benchmarks'))
      || (contains(github.event.pull_request.labels.*.name, 'run-heavy-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'run-heavy-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [base, small]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            benchmark-cache
          key: fleurs-clips-v1-${{ matrix.model }}
      - name: Install
        run: python -m pip install -e "engine[asr]"
      - name: Word error rate and speed on the frozen English, Hindi and Telugu clips
        run: |
          ilfu benchmark --model ${{ matrix.model }} --out report-${{ matrix.model }}.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Compare with the committed baseline (if there is one)
        run: |
          if [ -f benchmark/baseline-${{ matrix.model }}.json ]; then
            ilfu compare benchmark/baseline-${{ matrix.model }}.json report-${{ matrix.model }}.json
          else
            echo "No baseline committed yet for ${{ matrix.model }}; this run produces it."
          fi
      - name: Speed on one CPU core (stand-in for a weak computer)
        run: |
          taskset -c 0 ilfu benchmark --model ${{ matrix.model }} --count 8 --threads 1 --label "${{ matrix.model }}, 1 CPU core" --out report-${{ matrix.model }}-1core.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.model }}
          path: |
            report-*.json
            benchmark/frozen-clips.json

  benchmark-large:
    name: Accuracy and speed (${{ matrix.model }}, 10 clips each)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.heavy == 'all' || inputs.heavy == 'benchmarks'))
      || (contains(github.event.pull_request.labels.*.name, 'run-heavy-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'run-heavy-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [medium, large-v3-turbo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            benchmark-cache
          key: fleurs-clips-v1-${{ matrix.model }}
      - name: Install
        run: python -m pip install -e "engine[asr]"
      - name: Word error rate and speed on the first 10 frozen clips per language
        run: |
          ilfu benchmark --model ${{ matrix.model }} --count 10 --out report-${{ matrix.model }}.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.model }}
          path: report-*.json

  benchmark-indic:
    name: Accuracy and speed (IndicConformer, Hindi and Telugu)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.heavy == 'all' || inputs.heavy == 'benchmarks'))
      || (contains(github.event.pull_request.labels.*.name, 'run-heavy-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'run-heavy-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The model is gated on Hugging Face; huggingface_hub reads this token by itself.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check for the Hugging Face token
        id: token
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IndicConformer skipped: the HF_TOKEN secret is not set"
            {
              echo "### IndicConformer skipped"
              echo
              echo "ai4bharat/indic-conformer-600m-multilingual is a gated model on Hugging Face."
              echo "To run this benchmark, accept the model terms on Hugging Face with your account,"
              echo "make a read token, and add it to this repository as the secret HF_TOKEN."
              echo "Pull requests from forks never get secrets, so they always skip this job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: steps.token.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            benchmark-cache
          key: fleurs-clips-v1-indic
      - name: Install
        if: steps.token.outputs.ready == 'true'
        run: |
          python -m pip install -e "engine[asr]"
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers onnxruntime numpy soundfile
      - name: IndicConformer word error rate and speed on the frozen Hindi and Telugu clips
        if: steps.token.outputs.ready == 'true'
        run: python .github/scripts/indic_bench.py 25
      - if: steps.token.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-indicconformer
          path: report-indicconformer.json

  web-ui:
    name: Web interface in a real browser
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install
        run: |
          python -m pip install -e "engine[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Browser tests (setup wizard, record, captions, history, rename, delete)
        working-directory: engine
        run: pytest tests/test_web_ui.py -v

  speech-smoke:
    name: Real speech model smoke test
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.heavy == 'all' || inputs.heavy == 'speech-smoke'))
      || (contains(github.event.pull_request.labels.*.name, 'run-heavy-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'run-heavy-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with speech support
        run: python -m pip install -e "engine[asr]"
      - name: Download the tiny model and transcribe a generated tone
        run: |
          python - <<'PY'
          import math, struct, wave
          with wave.open("tone.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(struct.pack("<h", int(6000*math.sin(2*math.pi*440*i/16000))) for i in range(32000)))
          PY
          ilfu transcribe tone.wav --model tiny --format txt --out out.txt
          echo "transcription ran, output file:"; cat out.txt
