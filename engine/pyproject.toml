[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilfu"
version = "0.0.1"
description = "Open-source, local-first call transcriber engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
asr = ["faster-whisper>=1.1", "av>=11,<19"]
windows = ["PyAudioWPatch>=0.2.12; sys_platform == 'win32'"]

[project.scripts]
ilfu = "ilfu.cli:main"

[project.gui-scripts]
ilfu-gui = "ilfu.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
